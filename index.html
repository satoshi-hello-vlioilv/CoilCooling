<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>アルミニウムコイル 冷却シミュレータ（3D）</title>
<style>
  :root{
    --bg:#0b0e14; --panel:rgba(18,22,32,.82); --panel-bd:rgba(120,140,180,.18);
    --fg:#e8edf6; --muted:#9aa6bd; --accent:#4ea1ff; --accent2:#ff7a59;
    --good:#54d68a; --warn:#ffcf5c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;}
  #app{position:fixed;inset:0}
  canvas{display:block}

  .panel{position:fixed;background:var(--panel);border:1px solid var(--panel-bd);
    border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 8px 30px rgba(0,0,0,.45);}

  /* Title */
  #title{top:14px;left:50%;transform:translateX(-50%);padding:8px 16px;text-align:center;
    pointer-events:none}
  #title h1{margin:0;font-size:15px;letter-spacing:.02em}
  #title p{margin:2px 0 0;font-size:11px;color:var(--muted)}

  /* Controls (left) */
  #controls{top:14px;left:14px;width:288px;max-height:calc(100vh - 28px);
    overflow-y:auto;padding:14px 14px 16px}
  #controls h2{font-size:12px;margin:2px 0 10px;color:var(--accent);
    text-transform:uppercase;letter-spacing:.08em}
  .row{margin:11px 0}
  .row label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px}
  .row label b{color:var(--fg);font-weight:600}
  input[type=range]{width:100%;height:4px;-webkit-appearance:none;appearance:none;
    background:#28324a;border-radius:3px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
    background:var(--accent);cursor:pointer;border:2px solid #0b0e14;box-shadow:0 0 0 1px var(--accent)}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);
    cursor:pointer;border:2px solid #0b0e14}
  select{width:100%;background:#1a2233;color:var(--fg);border:1px solid var(--panel-bd);
    border-radius:8px;padding:7px 8px;font-size:12px;outline:none}
  .btns{display:flex;gap:8px;margin:4px 0 12px}
  button{flex:1;background:#1c2740;color:var(--fg);border:1px solid var(--panel-bd);
    border-radius:9px;padding:9px 8px;font-size:13px;cursor:pointer;transition:.12s;font-weight:600}
  button:hover{background:#26345a;border-color:var(--accent)}
  button.primary{background:linear-gradient(180deg,#2f6fd6,#2356b0);border-color:#3d7fe0}
  button.primary:hover{background:linear-gradient(180deg,#3a7ee6,#2a63c2)}
  .hr{height:1px;background:var(--panel-bd);margin:13px 0}
  .hint{font-size:10.5px;color:var(--muted);line-height:1.5;margin-top:2px}

  /* Stats (right) */
  #stats{top:14px;right:14px;width:212px;padding:13px 14px}
  #stats h2{font-size:12px;margin:0 0 10px;color:var(--accent2);text-transform:uppercase;letter-spacing:.08em}
  .stat{display:flex;justify-content:space-between;align-items:baseline;margin:7px 0;font-size:12px}
  .stat span{color:var(--muted)}
  .stat b{font-size:15px;font-variant-numeric:tabular-nums}
  .stat b.t{font-size:13px}
  #state{font-size:12px;text-align:center;margin-top:10px;padding:5px;border-radius:7px;
    background:#1a2233;font-weight:600}
  #state.cooling{color:var(--warn)}
  #state.done{color:var(--good)}
  #state.paused{color:var(--muted)}

  /* Legend (bottom-left) */
  #legend{bottom:14px;left:14px;padding:12px 14px;display:flex;gap:10px;align-items:stretch}
  #legend .bar{width:16px;border-radius:5px;border:1px solid var(--panel-bd)}
  #legend .scale{display:flex;flex-direction:column;justify-content:space-between;
    font-size:11px;font-variant-numeric:tabular-nums}
  #legend .ttl{font-size:10px;color:var(--muted);writing-mode:vertical-rl;text-orientation:mixed;
    align-self:center}

  /* Chart (bottom-right) */
  #chartWrap{bottom:14px;right:14px;padding:10px 12px 8px}
  #chartWrap .ct{font-size:11px;color:var(--muted);margin-bottom:6px;display:flex;
    justify-content:space-between;align-items:center}
  .lg{display:inline-flex;gap:10px;font-size:10.5px}
  .lg i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:3px;vertical-align:middle}
  #chart{display:block;border-radius:6px}

  /* Loading / error */
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:10px;background:var(--bg);z-index:50;text-align:center;padding:20px}
  #loading .sp{width:34px;height:34px;border:3px solid #2a3650;border-top-color:var(--accent);
    border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loading small{color:var(--muted);max-width:340px;line-height:1.6}

  @media (max-width:760px){
    #controls{width:248px}
    #stats{width:176px}
    #chartWrap{display:none}
    #title{display:none}
  }
  /* hidden scrollbar styling */
  #controls::-webkit-scrollbar{width:8px}
  #controls::-webkit-scrollbar-thumb{background:#2a3650;border-radius:4px}
</style>
</head>
<body>
<div id="app"></div>

<div id="loading">
  <div class="sp"></div>
  <div>3Dシミュレータを初期化しています…</div>
  <small>Three.js を CDN から読み込みます。表示されない場合はインターネット接続をご確認ください。</small>
</div>

<div id="title" class="panel">
  <h1>アルミニウムコイル 冷却シミュレータ</h1>
  <p>半径方向 熱伝導 ＋ 対流・放射冷却の3Dシミュレーション</p>
</div>

<div id="controls" class="panel">
  <h2>操作 / Controls</h2>
  <div class="btns">
    <button id="btnPlay" class="primary">▶ 再生</button>
    <button id="btnReset">⟲ リセット</button>
  </div>
  <div class="btns">
    <button id="btnView">視点リセット</button>
    <button id="btnSection">断面 表示</button>
  </div>

  <div class="row">
    <label>計算速度<b id="valSpeed">1800×</b></label>
    <select id="selSpeed">
      <option value="1">実時間（1×）</option>
      <option value="10">10×</option>
      <option value="60">60×（1分/秒）</option>
      <option value="300">300×（5分/秒）</option>
      <option value="1800" selected>1800×（30分/秒）</option>
      <option value="3600">3600×（1時間/秒）</option>
      <option value="1000000000000">最大速度</option>
    </select>
  </div>

  <div class="hr"></div>
  <h2>材料・温度</h2>

  <div class="row">
    <label>合金 / 材質<b id="valAlloy"></b></label>
    <select id="selAlloy">
      <option value="1100">A1100（純アルミ系）</option>
      <option value="3003" selected>A3003</option>
      <option value="5052">A5052</option>
      <option value="6061">A6061</option>
    </select>
  </div>
  <div class="row">
    <label>初期温度<b id="valInitT">350 °C</b></label>
    <input id="rngInitT" type="range" min="40" max="560" step="5" value="350">
  </div>
  <div class="row">
    <label>周囲温度（外気）<b id="valAmbT">25 °C</b></label>
    <input id="rngAmbT" type="range" min="-10" max="60" step="1" value="25">
  </div>
  <div class="row">
    <label>放射率 ε（表面）<b id="valEmis">0.20</b></label>
    <input id="rngEmis" type="range" min="0.02" max="0.95" step="0.01" value="0.20">
  </div>
  <div class="row">
    <label>半径方向 実効熱伝導率 k<b id="valK">3.0 W/mK</b></label>
    <input id="rngK" type="range" min="0" max="1000" step="1" value="0">
    <div class="hint">巻き重なり部の空気層・酸化皮膜により、コイル半径方向の実効値は無垢材（約237）より大幅に低下します。</div>
  </div>

  <div class="hr"></div>
  <h2>冷却条件</h2>
  <div class="row">
    <label>冷却方法<b></b></label>
    <select id="selCooling">
      <option value="10" selected>自然空冷（静止空気）</option>
      <option value="60">強制空冷（ファン）</option>
      <option value="300">ミスト冷却</option>
      <option value="3000">水焼入れ（急冷）</option>
    </select>
  </div>
  <div class="row">
    <label>熱伝達係数 h<b id="valH">10 W/m²K</b></label>
    <input id="rngH" type="range" min="0" max="1000" step="1" value="0">
  </div>

  <div class="hr"></div>
  <h2>コイル寸法</h2>
  <div class="row">
    <label>外径 OD<b id="valOD">1800 mm</b></label>
    <input id="rngOD" type="range" min="600" max="2400" step="50" value="1800">
  </div>
  <div class="row">
    <label>内径 ID（巻芯）<b id="valID">600 mm</b></label>
    <input id="rngID" type="range" min="200" max="1200" step="50" value="600">
  </div>
  <div class="row">
    <label>幅 W<b id="valW">1500 mm</b></label>
    <input id="rngW" type="range" min="300" max="2200" step="50" value="1500">
  </div>
  <div class="hint" id="dimHint"></div>
</div>

<div id="stats" class="panel">
  <h2>状態 / Status</h2>
  <div class="stat"><span>経過（コイル時間）</span><b class="t" id="stTime">0 秒</b></div>
  <div class="stat"><span>中心温度（最高）</span><b id="stCore">—</b></div>
  <div class="stat"><span>表面温度</span><b id="stSurf">—</b></div>
  <div class="stat"><span>平均温度</span><b id="stAvg">—</b></div>
  <div class="stat"><span>中心−表面 差</span><b id="stGrad">—</b></div>
  <div id="state" class="paused">一時停止中</div>
</div>

<div id="legend" class="panel">
  <div class="ttl">温度 °C</div>
  <div class="bar" id="legendBar"></div>
  <div class="scale" id="legendScale"></div>
</div>

<div id="chartWrap" class="panel">
  <div class="ct">
    <span>温度推移</span>
    <span class="lg"><span><i style="background:#ff5a47"></i>中心</span><span><i style="background:#4ea1ff"></i>表面</span></span>
  </div>
  <canvas id="chart" width="280" height="150"></canvas>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============================================================
//  定数・物性
// ============================================================
const SIGMA = 5.670374419e-8;     // ステファン・ボルツマン定数 W/m²K⁴
const N = 30;                     // 半径方向の分割数（有限体積セル数）
const BORE_FACTOR = 0.7;          // 内径(巻芯)側 対流の有効係数（外周より弱い）
const MAX_SUBSTEPS = 3000;        // 1フレームあたり最大計算ステップ
const DEG = Math.PI / 180;

// 合金物性（ρ:密度 kg/m³, cp:比熱 J/kgK）
const ALLOYS = {
  '1100': { rho: 2710, cp: 904, name: 'A1100' },
  '3003': { rho: 2730, cp: 893, name: 'A3003' },
  '5052': { rho: 2680, cp: 880, name: 'A5052' },
  '6061': { rho: 2700, cp: 896, name: 'A6061' },
};

// カラーマップ（青=低温 → 赤=高温）
const STOPS = [
  [0.00, [0.05, 0.07, 0.32]],
  [0.15, [0.10, 0.32, 0.86]],
  [0.35, [0.10, 0.76, 0.88]],
  [0.50, [0.22, 0.80, 0.32]],
  [0.66, [0.96, 0.91, 0.22]],
  [0.82, [0.97, 0.55, 0.10]],
  [1.00, [0.86, 0.11, 0.08]],
];

function colormap(t){
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  for(let i=0;i<STOPS.length-1;i++){
    const a = STOPS[i], b = STOPS[i+1];
    if(t <= b[0]){
      const f = (t - a[0]) / (b[0] - a[0] || 1);
      return [
        a[1][0] + (b[1][0]-a[1][0])*f,
        a[1][1] + (b[1][1]-a[1][1])*f,
        a[1][2] + (b[1][2]-a[1][2])*f,
      ];
    }
  }
  return STOPS[STOPS.length-1][1];
}

// ============================================================
//  シミュレーション状態
// ============================================================
const P = {                 // パラメータ（SI単位, 温度は°C）
  initT: 350, ambT: 25, emis: 0.20, k: 3.0, h: 10,
  OD: 1.8, ID: 0.6, W: 1.5,
  rho: 2730, cp: 893,
  speed: 1800,
};

let T  = new Float64Array(N);   // 各セル温度 °C
let Tn = new Float64Array(N);
let simTime = 0;                // 経過（コイル時間）秒
let playing = false;
let settled = false;

// 幾何定数（buildModel で更新）
let rIn, rOut, dr;
const rf   = new Float64Array(N+1); // セル境界半径
const Vol  = new Float64Array(N);   // セル体積（コイル全周）
const Aface= new Float64Array(N+1); // 半径方向 伝熱面積
const Aend = new Float64Array(N);   // 端面（上下）面積
let Ainner, Aouter;

let legendMin = 25, legendMax = 350;

// 履歴（グラフ用）
const hist = { t: [], core: [], surf: [] };

// ============================================================
//  物理：1ステップ更新（陽解法・有限体積）
// ============================================================
function surfLoss(Tc, h, A){
  // 対流 + 放射 による熱損失 [W]（Tc>ambで正）
  const Tk = Tc + 273.15, Tak = P.ambT + 273.15;
  return (h*(Tc - P.ambT) + P.emis*SIGMA*(Tk*Tk*Tk*Tk - Tak*Tak*Tak*Tak)) * A;
}
function hRad(Tc){
  const Tk = Tc + 273.15, Tak = P.ambT + 273.15;
  return P.emis*SIGMA*(Tk + Tak)*(Tk*Tk + Tak*Tak);
}

function stableDt(){
  // 陽解法の安定条件から許容時間刻みを推定
  let dtMin = Infinity;
  for(let i=0;i<N;i++){
    const hr = hRad(T[i]);
    let G = (P.h + hr) * Aend[i];                         // 端面
    G += (i>0)   ? P.k*Aface[i]/dr   : (P.h*BORE_FACTOR + hr)*Ainner;   // 内側
    G += (i<N-1) ? P.k*Aface[i+1]/dr : (P.h + hr)*Aouter;              // 外側
    const C = P.rho * P.cp * Vol[i];
    const dti = C / G;
    if(dti < dtMin) dtMin = dti;
  }
  return Math.max(1e-4, 0.5 * dtMin);
}

function step(dt){
  for(let i=0;i<N;i++){
    let Q = 0;
    // 内側面：隣接セルへの伝導 or 内径面からの放熱
    if(i>0) Q += P.k * Aface[i] * (T[i-1]-T[i]) / dr;
    else    Q -= surfLoss(T[0], P.h*BORE_FACTOR, Ainner);
    // 外側面：隣接セルへの伝導 or 外径面からの放熱
    if(i<N-1) Q += P.k * Aface[i+1] * (T[i+1]-T[i]) / dr;
    else      Q -= surfLoss(T[N-1], P.h, Aouter);
    // 上下端面からの放熱
    Q -= surfLoss(T[i], P.h, Aend[i]);

    Tn[i] = T[i] + dt * Q / (P.rho * P.cp * Vol[i]);
  }
  const tmp = T; T = Tn; Tn = tmp;
}

function advance(targetSeconds){
  let remaining = targetSeconds, count = 0;
  const dts = stableDt();
  while(remaining > 1e-9 && count < MAX_SUBSTEPS){
    const dt = Math.min(dts, remaining);
    step(dt);
    simTime += dt; remaining -= dt; count++;
  }
}

// 解析用 集計
function coreTemp(){ let m=-Infinity; for(let i=0;i<N;i++) if(T[i]>m) m=T[i]; return m; }
function avgTemp(){ let s=0, v=0; for(let i=0;i<N;i++){ s+=T[i]*Vol[i]; v+=Vol[i]; } return s/v; }
function surfTemp(){ return T[N-1]; }

// 半径 r における温度（セル中心値の線形補間）
function tempAtRadius(r){
  const x = (r - rIn)/dr - 0.5;
  if(x <= 0) return T[0];
  if(x >= N-1) return T[N-1];
  const i = Math.floor(x), f = x - i;
  return T[i]*(1-f) + T[i+1]*f;
}

// ============================================================
//  Three.js シーン
// ============================================================
let renderer, scene, camera, controls, grid, mesh, geo, colorAttr;
let vRadius;        // 各頂点の半径（再着色用）
let sectionCut = true;   // 断面（切り欠き）表示
const A_GAP = 60;        // 切り欠き角度(deg)
const A_START = 75 * DEG;

function initThree(){
  const app = document.getElementById('app');
  renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x0b0e14, 1);
  app.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x0b0e14, 8, 26);

  camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.01, 200);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 0.6;
  controls.maxDistance = 40;

  scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x303040, 0.85));
  const dl = new THREE.DirectionalLight(0xffffff, 1.1);
  dl.position.set(4, 7, 5); scene.add(dl);
  const dl2 = new THREE.DirectionalLight(0xaecbff, 0.35);
  dl2.position.set(-5, 2, -4); scene.add(dl2);

  window.addEventListener('resize', onResize);
}

function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// くさび切り欠き付き 環状ソリッドの生成
function buildGeometry(){
  const positions = [], radii = [], indices = [];
  const aSpan = sectionCut ? (360 - A_GAP)*DEG : 360*DEG;
  const aSeg = sectionCut ? 90 : 100;
  const rSeg = 46, hSeg = 1;
  const halfW = P.W/2;

  function addGrid(uCount, vCount, fn){
    const base = positions.length/3;
    for(let iu=0;iu<=uCount;iu++)
      for(let iv=0;iv<=vCount;iv++){
        const p = fn(iu/uCount, iv/vCount);
        positions.push(p.x, p.y, p.z); radii.push(p.r);
      }
    for(let iu=0;iu<uCount;iu++)
      for(let iv=0;iv<vCount;iv++){
        const a = base + iu*(vCount+1) + iv;
        const b = base + (iu+1)*(vCount+1) + iv;
        const c = base + (iu+1)*(vCount+1) + (iv+1);
        const d = base + iu*(vCount+1) + (iv+1);
        indices.push(a,b,c, a,c,d);
      }
  }
  const ang = u => A_START + u*aSpan;
  const rad = v => rIn + v*(rOut - rIn);

  // 上面・下面（半径方向に温度勾配が見える）
  for(const sgn of [1,-1]){
    addGrid(aSeg, rSeg, (u,v)=>{
      const a = ang(u), r = rad(v);
      return { x: r*Math.cos(a), y: sgn*halfW, z: r*Math.sin(a), r };
    });
  }
  // 外周面・内周面
  addGrid(aSeg, hSeg, (u,v)=>{
    const a = ang(u), y = -halfW + v*P.W;
    return { x: rOut*Math.cos(a), y, z: rOut*Math.sin(a), r: rOut };
  });
  addGrid(aSeg, hSeg, (u,v)=>{
    const a = ang(u), y = -halfW + v*P.W;
    return { x: rIn*Math.cos(a), y, z: rIn*Math.sin(a), r: rIn };
  });
  // 切り欠き端面（断面：半径方向勾配がよく見える）
  if(sectionCut){
    for(const a of [A_START, A_START + aSpan]){
      addGrid(rSeg, hSeg, (u,v)=>{
        const r = rad(u), y = -halfW + v*P.W;
        return { x: r*Math.cos(a), y, z: r*Math.sin(a), r };
      });
    }
  }

  geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  colorAttr = new THREE.Float32BufferAttribute(new Float32Array(positions.length), 3);
  geo.setAttribute('color', colorAttr);
  geo.setIndex(indices);
  geo.computeVertexNormals();
  vRadius = radii;
}

function buildModel(resetTemps){
  // 寸法（m）から幾何定数を更新
  rIn = P.ID/2; rOut = P.OD/2; dr = (rOut - rIn)/N;
  for(let i=0;i<=N;i++){ rf[i] = rIn + i*dr; Aface[i] = 2*Math.PI*rf[i]*P.W; }
  for(let i=0;i<N;i++){
    const a = rf[i], b = rf[i+1];
    Vol[i]  = Math.PI*(b*b - a*a)*P.W;
    Aend[i] = 2*Math.PI*(b*b - a*a);   // 上下2面
  }
  Ainner = Aface[0]; Aouter = Aface[N];

  if(resetTemps){
    for(let i=0;i<N;i++) T[i] = P.initT;
    simTime = 0; settled = false;
    hist.t.length = 0; hist.core.length = 0; hist.surf.length = 0;
    legendMin = P.ambT; legendMax = Math.max(P.initT, P.ambT + 1);
    updateLegend();
  }

  // ジオメトリ再構築
  if(mesh){ scene.remove(mesh); geo.dispose(); }
  buildGeometry();
  const mat = new THREE.MeshStandardMaterial({
    vertexColors:true, metalness:0.12, roughness:0.62, side:THREE.DoubleSide,
  });
  mesh = new THREE.Mesh(geo, mat);
  scene.add(mesh);

  // 床グリッド
  if(grid) scene.remove(grid);
  const span = Math.ceil(P.OD*1.6);
  grid = new THREE.GridHelper(span*2, span*2, 0x2a3650, 0x18202f);
  grid.position.y = -P.W/2 - 0.02;
  scene.add(grid);

  recolor();
}

function resetView(){
  const d = Math.max(P.OD, P.W) * 1.85;
  camera.position.set(d*0.82, d*0.55, d*0.82);
  controls.target.set(0, 0, 0);
  controls.update();
}

function recolor(){
  const inv = 1/(legendMax - legendMin);
  for(let vi=0; vi<vRadius.length; vi++){
    const Tc = tempAtRadius(vRadius[vi]);
    const c = colormap((Tc - legendMin)*inv);
    colorAttr.setXYZ(vi, c[0], c[1], c[2]);
  }
  colorAttr.needsUpdate = true;
}

// ============================================================
//  UI
// ============================================================
const $ = id => document.getElementById(id);

function fmtTime(s){
  s = Math.floor(s);
  if(s < 60) return s + ' 秒';
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  if(h > 0) return `${h} 時間 ${m} 分`;
  return `${m} 分 ${sec} 秒`;
}
function fmtTimeShort(s){
  if(s < 3600) return Math.floor(s/60) + 'm';
  return (s/3600).toFixed(1) + 'h';
}

// 対数スライダー（0..1000 → min..max）
const logVal = (min,max,s)=> min*Math.pow(max/min, s/1000);
const logPos = (min,max,v)=> Math.round(1000*Math.log(v/min)/Math.log(max/min));
const H_MIN=2, H_MAX=6000, K_MIN=0.5, K_MAX=237;

function setPlay(on){
  playing = on;
  $('btnPlay').textContent = on ? '⏸ 一時停止' : '▶ 再生';
  $('btnPlay').classList.toggle('primary', !on);
  if(on) settled = false;
  updateState();
}

function updateState(){
  const el = $('state');
  if(settled){ el.textContent = '✓ 冷却完了（平衡）'; el.className = 'done'; }
  else if(playing){ el.textContent = '● 冷却中…'; el.className = 'cooling'; }
  else { el.textContent = '一時停止中'; el.className = 'paused'; }
}

function updateLegend(){
  const bar = $('legendBar');
  const stops = STOPS.map(s=>{
    const c = s[1].map(x=>Math.round(x*255));
    return `rgb(${c[0]},${c[1]},${c[2]}) ${(s[0]*100).toFixed(0)}%`;
  }).join(',');
  bar.style.background = `linear-gradient(to top, ${stops})`;
  bar.style.minHeight = '120px';
  const sc = $('legendScale');
  sc.innerHTML = '';
  for(let i=4;i>=0;i--){
    const t = i/4, v = legendMin + t*(legendMax-legendMin);
    const div = document.createElement('div');
    div.textContent = Math.round(v) + '°';
    sc.appendChild(div);
  }
}

function bindUI(){
  // 再生/リセット/視点
  $('btnPlay').onclick = ()=> setPlay(!playing);
  $('btnReset').onclick = ()=>{ buildModel(true); setPlay(false); drawChart(); updateStats(); };
  $('btnView').onclick = resetView;
  $('btnSection').onclick = ()=>{
    sectionCut = !sectionCut;
    $('btnSection').textContent = sectionCut ? '断面 表示' : '全周 表示';
    buildModel(false);
  };

  // 速度
  $('selSpeed').onchange = e=>{
    P.speed = parseFloat(e.target.value);
    const txt = P.speed >= 1e11 ? '最大' : P.speed + '×';
    $('valSpeed').textContent = txt;
  };

  // 合金
  $('selAlloy').onchange = e=>{
    const a = ALLOYS[e.target.value];
    P.rho = a.rho; P.cp = a.cp;
    $('valAlloy').textContent = a.name;
  };

  // 初期温度（リセットが必要）
  $('rngInitT').oninput = e=>{
    P.initT = parseFloat(e.target.value);
    $('valInitT').textContent = P.initT + ' °C';
  };
  $('rngInitT').onchange = ()=>{ buildModel(true); drawChart(); updateStats(); };

  // 周囲温度（即時反映）
  $('rngAmbT').oninput = e=>{
    P.ambT = parseFloat(e.target.value);
    $('valAmbT').textContent = P.ambT + ' °C';
    legendMin = P.ambT; updateLegend();
  };

  // 放射率（即時）
  $('rngEmis').oninput = e=>{
    P.emis = parseFloat(e.target.value);
    $('valEmis').textContent = P.emis.toFixed(2);
  };

  // 熱伝導率 k（対数, 即時）
  $('rngK').oninput = e=>{
    P.k = logVal(K_MIN, K_MAX, parseFloat(e.target.value));
    $('valK').textContent = P.k.toFixed(1) + ' W/mK';
  };

  // 冷却方法 → h を設定
  $('selCooling').onchange = e=>{
    P.h = parseFloat(e.target.value);
    $('rngH').value = logPos(H_MIN, H_MAX, P.h);
    $('valH').textContent = Math.round(P.h) + ' W/m²K';
  };
  // 熱伝達係数 h（対数, 即時）
  $('rngH').oninput = e=>{
    P.h = logVal(H_MIN, H_MAX, parseFloat(e.target.value));
    $('valH').textContent = Math.round(P.h) + ' W/m²K';
  };

  // 寸法（リセット＋ジオメトリ再構築）
  const clampDims = ()=>{
    if(P.ID > P.OD - 0.2){ P.ID = P.OD - 0.2;
      $('rngID').value = Math.round(P.ID*1000);
      $('valID').textContent = Math.round(P.ID*1000) + ' mm'; }
  };
  $('rngOD').oninput = e=>{ P.OD = parseFloat(e.target.value)/1000;
    $('valOD').textContent = Math.round(P.OD*1000) + ' mm'; clampDims(); updateDimHint(); };
  $('rngID').oninput = e=>{ P.ID = parseFloat(e.target.value)/1000;
    $('valID').textContent = Math.round(P.ID*1000) + ' mm'; clampDims(); updateDimHint(); };
  $('rngW').oninput  = e=>{ P.W = parseFloat(e.target.value)/1000;
    $('valW').textContent = Math.round(P.W*1000) + ' mm'; updateDimHint(); };
  for(const id of ['rngOD','rngID','rngW'])
    $(id).onchange = ()=>{ buildModel(true); resetView(); drawChart(); updateStats(); };

  // 初期表示反映
  $('valAlloy').textContent = ALLOYS['3003'].name;
  $('rngK').value = logPos(K_MIN, K_MAX, P.k);
  $('valK').textContent = P.k.toFixed(1) + ' W/mK';
  $('rngH').value = logPos(H_MIN, H_MAX, P.h);
  $('valH').textContent = Math.round(P.h) + ' W/m²K';
  updateDimHint();
}

function updateDimHint(){
  const massPerCoil = P.rho * Math.PI*((P.OD/2)**2 - (P.ID/2)**2) * P.W;
  $('dimHint').textContent =
    `推定質量 約 ${(massPerCoil/1000).toFixed(1)} t（中実換算）／ 肉厚 ${Math.round((P.OD-P.ID)/2*1000)} mm`;
}

// ============================================================
//  統計・グラフ描画
// ============================================================
let lastStat = 0, lastChart = 0;
function updateStats(){
  const core = coreTemp(), surf = surfTemp(), avg = avgTemp();
  $('stTime').textContent = fmtTime(simTime);
  $('stCore').textContent = core.toFixed(1) + ' °C';
  $('stSurf').textContent = surf.toFixed(1) + ' °C';
  $('stAvg').textContent  = avg.toFixed(1) + ' °C';
  $('stGrad').textContent = (core - surf).toFixed(1) + ' °C';
}

function sample(){
  hist.t.push(simTime); hist.core.push(coreTemp()); hist.surf.push(surfTemp());
  if(hist.t.length > 1400){
    for(const key of ['t','core','surf']){
      const a = hist[key]; const b = [];
      for(let i=0;i<a.length;i+=2) b.push(a[i]);
      hist[key] = b;
    }
  }
}

const chart = $('chart'), cx = chart.getContext('2d');
function drawChart(){
  const W = chart.width, H = chart.height, pad = 26;
  cx.clearRect(0,0,W,H);
  cx.fillStyle = '#0e1320'; cx.fillRect(0,0,W,H);

  const tMax = Math.max(1, hist.t[hist.t.length-1] || 1);
  const yMin = legendMin, yMax = legendMax;
  const X = t => pad + (W-pad-6) * (t/tMax);
  const Y = v => (H-pad) - (H-pad-8) * ((v-yMin)/(yMax-yMin || 1));

  // グリッド + 目盛
  cx.strokeStyle = '#1d2740'; cx.fillStyle = '#5e6b85';
  cx.font = '9px sans-serif'; cx.lineWidth = 1;
  for(let i=0;i<=4;i++){
    const v = yMin + i/4*(yMax-yMin), y = Y(v);
    cx.beginPath(); cx.moveTo(pad,y); cx.lineTo(W-6,y); cx.stroke();
    cx.fillText(Math.round(v)+'°', 2, y+3);
  }
  cx.fillText('0', pad-2, H-12);
  cx.fillText(fmtTimeShort(tMax), W-26, H-12);

  // 曲線
  const line = (arr, color)=>{
    cx.strokeStyle = color; cx.lineWidth = 1.8; cx.beginPath();
    for(let i=0;i<arr.length;i++){
      const x = X(hist.t[i]), y = Y(arr[i]);
      i ? cx.lineTo(x,y) : cx.moveTo(x,y);
    }
    cx.stroke();
  };
  if(hist.t.length > 1){
    line(hist.surf, '#4ea1ff');
    line(hist.core, '#ff5a47');
  }
}

// ============================================================
//  メインループ
// ============================================================
let clock;
function animate(){
  requestAnimationFrame(animate);
  const realDt = Math.min(clock.getDelta(), 0.05);

  if(playing && !settled){
    advance(P.speed * realDt);
    sample();
    if(coreTemp() - P.ambT < 0.5){ settled = true; playing = false; setPlay(false); }
  }

  recolor();
  controls.update();
  renderer.render(scene, camera);

  const now = performance.now();
  if(now - lastStat > 100){ updateStats(); lastStat = now; }
  if(now - lastChart > 120){ drawChart(); lastChart = now; }
}

// ============================================================
//  起動
// ============================================================
function start(){
  initThree();
  bindUI();
  buildModel(true);
  resetView();
  updateStats(); drawChart(); updateState();
  clock = new THREE.Clock();
  animate();
  document.getElementById('loading').style.display = 'none';
  window.__simReady = true;
}

try { start(); }
catch(err){
  console.error(err);
  document.getElementById('loading').innerHTML =
    '<div style="color:#ff7a59">初期化に失敗しました</div>' +
    '<small>' + (err && err.message ? err.message : err) +
    '<br>インターネット接続（CDN: unpkg.com）をご確認ください。</small>';
}
</script>
